<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E150D">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Admin Agri-Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4EE;--surface:#FFFFFF;--ink:#1C2219;--muted:#5C6157;--faint:#7A7F73;--line:#DFE2D6;--soft:#ECEFE5;
  --green:#2D4A26;--green-d:#1C3017;--gold:#B08D57;--gold-soft:#F1E8D8;--red:#A33A2B;--red-soft:#F8E6E1;
  --band:#0E150D;--band-ink:#EDEFE6;--band-muted:#AEB5A4;--band-line:#2A3626;
  --s1:#B08D57;--s2:#5E8F4E;--s3:#8C6B3E;--s4:#A9C49B;
  --display:"Josefin Sans","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
  --text:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D110B;--surface:#161C13;--ink:#E6EBDF;--muted:#A6AE9E;--faint:#8D9586;--line:#273022;--soft:#1F271A;
  --green:#7FB069;--green-d:#B5D99C;--gold:#C9A66B;--gold-soft:#2E2618;--red:#E8836F;--red-soft:#3A2619;
  --band:#050805;--band-line:#1E281B;--s1:#C9A66B;--s2:#7FB069;--s3:#A88452;--s4:#4F6B44;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D110B;--surface:#161C13;--ink:#E6EBDF;--muted:#A6AE9E;--faint:#8D9586;--line:#273022;--soft:#1F271A;
  --green:#7FB069;--green-d:#B5D99C;--gold:#C9A66B;--gold-soft:#2E2618;--red:#E8836F;--red-soft:#3A2619;
  --band:#050805;--band-line:#1E281B;--s1:#C9A66B;--s2:#7FB069;--s3:#A88452;--s4:#4F6B44;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Bandeau nuit */
.band{background:var(--band);color:var(--band-ink);padding:22px clamp(16px,4vw,48px) 30px}
.band-top{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto}
.band-top img{height:46px;border-radius:8px;display:block}
.band-top h1{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.02em;margin:0;flex:1;min-width:0}
.band-top .tools{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--band-line);color:var(--band-ink);border-radius:10px;height:42px;padding:0 14px;font-size:15px;font-weight:600}
.ghost:hover{border-color:var(--gold)}
.hero{max-width:1180px;margin:26px auto 0}
.hero h2{font-family:var(--display);font-weight:400;font-size:clamp(18px,2.4vw,24px);margin:0;color:var(--band-muted)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(54px,10vw,112px);line-height:.95;margin:10px 0 18px;letter-spacing:-.01em;color:var(--band-ink)}
.big small{font-size:.42em;font-weight:600;color:var(--gold);margin-left:.12em}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--band-line);max-width:760px}
.split i{display:block;height:100%}
.split-legend{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:10px;font-size:16px;max-width:760px}
.split-legend b{font-weight:700}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.facts{margin-top:14px;color:var(--band-muted);font-size:15px}
.facts strong{color:var(--band-ink)}

/* Dépôt des fichiers */
.drop{max-width:1180px;margin:26px auto 0;border:2px dashed var(--band-line);border-radius:18px;padding:clamp(26px,5vw,56px) 24px;text-align:center}
.drop.over{border-color:var(--gold);background:rgba(176,141,87,.08)}
.drop h2{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,38px);margin:0 0 8px;color:var(--band-ink)}
.drop p{margin:0 auto 22px;color:var(--band-muted);max-width:56ch}
.drop .acts{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.pick{display:inline-flex;align-items:center;height:52px;padding:0 22px;border-radius:12px;background:var(--gold);color:#1A1408;font-weight:700;font-size:17px;border:none;cursor:pointer}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.demo{height:52px;padding:0 20px;border-radius:12px;border:1px solid var(--band-line);background:transparent;color:var(--band-ink);font-weight:600;font-size:16px}

/* Filtres */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.filters .in{max-width:1180px;margin:0 auto;padding:10px clamp(16px,4vw,48px);display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fgroup>span{font-size:14px;color:var(--muted);margin-right:2px}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600}
.chip.on{background:var(--green);border-color:var(--green);color:var(--surface)}
.filters .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--green)}
label.btn{cursor:pointer;position:relative}
label.btn input{position:absolute;width:1px;height:1px;opacity:0}

/* Contenu */
main{max-width:calc(1180px + 2 * clamp(16px,4vw,48px));margin:0 auto;padding:22px clamp(16px,4vw,48px) 60px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px}
section{grid-column:span 12;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
section.half{grid-column:span 6}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;margin-top:6px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.kpi span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi small{font-size:13px;color:var(--muted)}
.kpi.warn b{color:var(--red,#C0392B)}
section h3{font-family:var(--display);font-weight:600;font-size:22px;margin:0 0 4px}
section .lead{color:var(--muted);font-size:15px;margin:0 0 14px}
.alerts{grid-column:span 12;display:flex;flex-direction:column;gap:8px}
.alert{border-radius:12px;padding:12px 16px;font-size:15px;background:var(--gold-soft);border:1px solid var(--gold)}
.alert.err{background:var(--red-soft);border-color:var(--red)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
th.r,td.r{text-align:right;white-space:nowrap}
tr.cat td{background:var(--soft);font-weight:700}
tr.tot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none}
.bname strong{display:block}.bname .sub{display:block;font-size:13px;color:var(--muted)}
.share{display:block;height:6px;border-radius:3px;background:var(--gold);margin-top:6px;max-width:140px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--gold-soft);color:var(--ink);margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{border:none;background:none;height:36px;padding:0 14px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--soft);color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--text);font-size:12px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted);margin-top:6px}
.reconcile{font-size:14px;color:var(--muted);margin-top:12px}
.cancel td:first-child,.cancel td:nth-child(2){white-space:nowrap}
.motif{color:var(--red);font-weight:600}
.empty{color:var(--muted);font-size:15px;padding:6px 0}
.files td .x{border:none;background:none;color:var(--red);font-weight:700;padding:2px 6px}
.status{font-size:13px;font-weight:700}
.status.ok{color:var(--green)}.status.rep{color:var(--gold)}.status.err{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:12px;font-weight:600;font-size:15px;z-index:20;max-width:calc(100% - 32px)}

/* ---------- Coquille Admin : bandeau + menu des modules ---------- */
.shell{background:var(--band);color:var(--band-ink);border-bottom:1px solid var(--band-line);padding:0 clamp(16px,4vw,48px)}
.shell .in{max-width:1180px;margin:0 auto;padding:14px 0 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:44px;width:44px;border-radius:10px;display:block;background:#fff}
.brand .name{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.brand .name b{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em}
.brand .name span{font-size:14px;color:var(--band-muted);letter-spacing:.02em}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;background:none;border:none;color:var(--band-muted);height:44px;padding:0 14px;font-size:15px;font-weight:600;border-bottom:3px solid transparent;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.nav button:hover{color:var(--band-ink)}
.nav button.on{color:var(--band-ink);border-bottom-color:var(--gold)}
.nav button svg{width:18px;height:18px;flex:none}
.subnav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 0 14px}
.subnav::-webkit-scrollbar{display:none}
.subnav .rchip{flex:none;height:36px;padding:0 16px;font-size:14px}
.ssbar{max-width:1180px;margin:10px auto 0}
.ssbar .rchip{height:36px;font-size:14px}
.sstab tr.ssgrp td{background:var(--soft);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:8px;padding-bottom:8px}
.sstab tr.sstot td{font-weight:700;border-top:2px solid var(--line)}
.sstab .qty{width:110px}
@media (max-width:560px){.sstab .qty{width:84px}}
.ssform{display:flex;flex-direction:column;gap:8px;max-width:520px}
.ssfhead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;margin-bottom:14px}
.ssfhead>div{display:flex;flex-direction:column;gap:6px}
.ssfind{flex:1;min-width:180px;max-width:360px}
.ssnabox{margin:16px 0 0}
.ssna{display:flex;flex-direction:column;gap:8px;max-width:520px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px}
.ssna h4{margin:0;font-size:17px}
.ssfoot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.ssfoot p{margin:0;font-weight:600}
.sslivs{display:flex;flex-direction:column;gap:10px}
.sslv{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sslv.danger{border-color:var(--red)}
.sslv p{margin:0;font-size:14px;color:var(--muted)}
.sslv p b{color:var(--ink)}
.sschips{margin:0 0 10px}
.ssre{margin-left:4px;color:var(--ink);border-color:var(--line)}
.ssgrid th .sub{display:block;font-size:11px;font-weight:600;color:var(--faint);text-transform:none;letter-spacing:0}
.ssgrid td.neg{color:var(--red);font-weight:700}
.sstab th .sm{display:none}
.ssarrow{align-self:flex-end;padding-bottom:10px;font-size:20px;color:var(--muted)}
.mvtag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--green-d,var(--green))}
.mvtag.tr{background:var(--gold-soft);color:var(--ink)}
.sslv p.mvwho{color:var(--ink);font-weight:600}
@media (max-width:560px){.sstab th .lg{display:none}.sstab th .sm{display:inline}.ssgrid td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}.ssgrid tr.ssgrp td:first-child{background:var(--soft)}section .row-between .cbtns{margin-bottom:6px}.ssarrow{display:none}.ssfhead>div{flex:1 1 100%}.ssfhead select{width:100%}}
td>.sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.artst th,.artst td{white-space:nowrap}
.artst td:first-child{white-space:normal;min-width:150px}
.artst .atot{background:var(--soft)}
@media (max-width:560px){.artst td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}.artst tr.cat td:first-child{background:var(--soft)}}
.remt{margin-top:12px}.remt td.r .sub{text-align:right}.remt td:first-child .sub{text-align:left}
.hspick{max-width:1180px;margin:12px auto 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
.hspick .fl{flex-basis:100%;color:var(--band-muted)}
.hspick select{font:inherit;height:42px;border-radius:10px;border:1px solid var(--band-line);background:var(--band);color:var(--band-ink);padding:0 12px;min-width:0;max-width:100%;flex:1 1 320px}
.hsum2{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;margin:6px 0 14px;font-size:17px}
.hstable{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hsale{display:grid;grid-template-columns:80px minmax(0,1fr) 220px 100px;gap:14px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--soft)}
.hsale:last-child{border-bottom:none}
.hsale .hh b{display:block;font-size:18px}.hsale .hh small{color:var(--faint);font-size:12px}
.hsale .hl{display:flex;flex-direction:column;gap:3px;font-size:15px}
.hsale .hpm{font-size:14px;color:var(--muted);font-weight:600}
.hsale .htt{font-size:18px;font-weight:800;text-align:right}
.hsrem{color:var(--gold);font-style:normal;font-weight:600}
.hsliv{color:var(--green);font-weight:600;font-size:14px}
.hsann{color:var(--red);font-weight:700;font-size:14px}
.hsale.cancelled .hh b,.hsale.cancelled .hl>span:not(.hsann):not(.hsliv),.hsale.cancelled .hpm,.hsale.cancelled .htt{opacity:.45;text-decoration:line-through}
@media (max-width:700px){.hsale{grid-template-columns:1fr auto;grid-template-areas:"hh htt" "hl hl" "hpm hpm";gap:4px 12px;padding:12px 14px}.hsale .hh{grid-area:hh;display:flex;gap:8px;align-items:baseline}.hsale .htt{grid-area:htt}.hsale .hl{grid-area:hl}.hsale .hpm{grid-area:hpm;font-size:13px}}
.cxpick{max-width:1180px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end}
.cxpick>div{display:flex;flex-direction:column;gap:6px}
.cxpick .fl{color:var(--band-muted)}
.cxpick input[type=date]{font:inherit;height:40px;border-radius:10px;border:1px solid var(--band-line);background:var(--band);color:var(--band-ink);padding:0 10px;color-scheme:dark}
.cxpick .rchip{height:36px;font-size:14px}
.cxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0}
.cxt{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.cxt .l{font-size:13px;color:var(--muted);font-weight:600}.cxt strong{font-size:20px}.cxt .s{font-size:12px;color:var(--faint)}
.cxt.em{border-color:var(--gold);background:var(--gold-soft)}
.cxacts{margin-top:6px}
.cbadge.ok2{background:var(--soft);color:var(--green)}
.cxform form{max-width:640px}
.cxdt{margin:4px 0}
.coins{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.coin{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.coin input{height:40px !important;text-align:right}
.cxlive{margin:6px 0 2px;font-size:15px}
.cxmot{gap:6px}
.cxjr{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cxe{display:grid;grid-template-columns:70px minmax(0,1fr) auto auto;gap:12px;align-items:start;padding:10px 14px;border-bottom:1px solid var(--soft)}
.cxe:last-child{border-bottom:none}.cxe.old{opacity:.6}.cxe.danger{background:var(--red-soft)}
.cxe .b{display:flex;flex-direction:column;gap:2px;min-width:0}.cxe .d{font-size:14px;color:var(--muted)}
.cxe .src{font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.cxe .x{border:none;background:none;color:var(--red);font-weight:700;padding:2px 6px;font-size:14px}
@media (max-width:560px){.cxe{grid-template-columns:52px minmax(0,1fr)}.cxe .src,.cxe .x,.cxe .cbtns{grid-column:2;justify-self:start}.row2{flex-wrap:wrap}}
.klist{display:flex;flex-direction:column;gap:8px}
.kitem{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.kitem .kt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.kitem input{max-width:320px}
.cocard{border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:12px 14px;margin:0 0 10px;background:var(--surface)}
.cocard p{margin:6px 0 0}.cocard .row-between{gap:8px;flex-wrap:wrap}
.cocard.st-prete{border-left-color:var(--green)}.cocard.st-livree{border-left-color:var(--line);opacity:.8}.cocard.st-annulee{border-left-color:var(--red);opacity:.65}
.cocard.danger{border-color:var(--red)}.cocard .cbtns{margin-top:10px;align-items:center}
.cocard .x{border:none;background:none;color:var(--red);font-weight:700;padding:2px 6px;font-size:14px}
.costat{font-size:13px;font-weight:700;padding:3px 10px;border-radius:12px;background:var(--gold);color:#1A1408;white-space:nowrap}
.costat.st-prete{background:var(--green);color:#fff}.costat.st-livree{background:var(--line);color:inherit}.costat.st-annulee{background:var(--red);color:#fff}
.coart{font-size:15px}.codate{margin:16px 0 8px;font-size:15px}.codate.cap::first-letter{text-transform:uppercase}.cocard a{color:inherit}
.cosearch{width:100%;max-width:520px;margin:0 0 12px}
.pick.sm2{height:38px;padding:0 14px;font-size:14px}
.cogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 10px}.cogrid>div{min-width:0}.cogrid input,.cogrid select{width:100%}
.cogrid .wide{grid-column:1/-1}.coform .rsel{margin:4px 0 10px}.cototal{font-size:18px;margin:10px 0}
.facard{border:1px solid var(--line);border-left:5px solid var(--green);border-radius:12px;padding:12px 14px;margin:0 0 10px;background:var(--surface)}

.qplus{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--green);background:var(--surface);color:var(--green);font-size:20px;font-weight:700;line-height:1;padding:0}
.qplus:hover{background:var(--green);color:var(--surface)}
.qwrap .qplus[hidden]{display:block!important;visibility:hidden}
.qadd{display:inline-flex;align-items:center;gap:6px;flex-basis:100%;justify-content:flex-end}
.qadd .qsign{font-weight:800;color:var(--green);font-size:18px}
.qadd .addin{width:90px;border-color:var(--green)}
.qadd .btn.sm{height:36px}


.ghtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.ghtabs button{flex:none;background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-1px;height:42px;padding:0 16px;font-size:15px;font-weight:700;color:var(--muted)}
.ghtabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.ghtabs button:hover{color:var(--ink)}
/* Bilan : alertes fermables */
.alert.closable{display:flex;align-items:flex-start;gap:12px}
.alert.closable .atext{flex:1;min-width:0}
.aclose{flex:none;width:32px;height:32px;margin:-6px -8px -6px 0;border:none;background:transparent;border-radius:8px;font-size:15px;font-weight:700;color:var(--muted);line-height:1}
.aclose:hover{background:rgba(0,0,0,.07);color:var(--ink)}
.alerts-head{display:flex;justify-content:flex-end}
@media (max-width:860px){section.half{grid-column:span 12}.filters .right{margin-left:0}}
@media (max-width:560px){.brand .lbl{display:none}.brand img{height:38px;width:38px}.brand .name b{font-size:18px}.filters{position:static}.band-top img{height:38px}.band-top h1{font-size:18px}section{padding:16px 14px}td,th{padding:8px 6px}.band-top .tools .lbl{display:none}}
@media print{
  .shell{display:none!important}
  .filters,.drop,.band-top .tools,.files,.noprint,.toast{display:none!important}
  body{background:#fff;color:#000}.band{background:#fff;color:#000;padding:0 0 10px}
  .big,.drop h2,.hero h2,.facts strong{color:#000}.facts{color:#333}
  section{break-inside:avoid;border-color:#ccc}main{display:block}section{margin-bottom:14px}
  body.printliv .band,body.printliv .subnav,body.printliv main>*:not(.livlist){display:none!important}
  body.printliv .livlist{break-inside:auto}body.printliv .livtab tr{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    pr.cash += +p.cash || 0; pr.bc += +p.bancontact || 0; pr.np += np; pr.vir += vir; pr.total += vt; if (v.facture && typeof v.facture === 'object') pr.nFact++;

      var a = S.art[key] || (S.art[key] = { libelle: l.libelle, cat: l.produitId ? cat : 'Articles libres', libre: !l.produitId, q: 0, m: 0, per: {} });
