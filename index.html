<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E150D">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Admin Chlorophylle Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4EE;--surface:#FFFFFF;--ink:#1C2219;--muted:#5C6157;--faint:#7A7F73;--line:#DFE2D6;--soft:#ECEFE5;
  --green:#2D4A26;--green-d:#1C3017;--gold:#B08D57;--gold-soft:#F1E8D8;--red:#A33A2B;--red-soft:#F8E6E1;
  --band:#0E150D;--band-ink:#EDEFE6;--band-muted:#AEB5A4;--band-line:#2A3626;
  --s1:#B08D57;--s2:#5E8F4E;--s3:#8C6B3E;--s4:#A9C49B;
  --display:"Josefin Sans","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
  --text:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D110B;--surface:#161C13;--ink:#E6EBDF;--muted:#A6AE9E;--faint:#8D9586;--line:#273022;--soft:#1F271A;
  --green:#7FB069;--green-d:#B5D99C;--gold:#C9A66B;--gold-soft:#2E2618;--red:#E8836F;--red-soft:#3A2619;
  --band:#050805;--band-line:#1E281B;--s1:#C9A66B;--s2:#7FB069;--s3:#A88452;--s4:#4F6B44;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D110B;--surface:#161C13;--ink:#E6EBDF;--muted:#A6AE9E;--faint:#8D9586;--line:#273022;--soft:#1F271A;
  --green:#7FB069;--green-d:#B5D99C;--gold:#C9A66B;--gold-soft:#2E2618;--red:#E8836F;--red-soft:#3A2619;
  --band:#050805;--band-line:#1E281B;--s1:#C9A66B;--s2:#7FB069;--s3:#A88452;--s4:#4F6B44;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Bandeau nuit */
.band{background:var(--band);color:var(--band-ink);padding:22px clamp(16px,4vw,48px) 30px}
.band-top{display:flex;align-items:center;gap:14px}
.band-top img{height:46px;border-radius:8px;display:block}
.band-top h1{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.02em;margin:0;flex:1;min-width:0}
.band-top .tools{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--band-line);color:var(--band-ink);border-radius:10px;height:42px;padding:0 14px;font-size:15px;font-weight:600}
.ghost:hover{border-color:var(--gold)}
.hero{max-width:1180px;margin:26px auto 0}
.hero h2{font-family:var(--display);font-weight:400;font-size:clamp(18px,2.4vw,24px);margin:0;color:var(--band-muted)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(54px,10vw,112px);line-height:.95;margin:10px 0 18px;letter-spacing:-.01em;color:var(--band-ink)}
.big small{font-size:.42em;font-weight:600;color:var(--gold);margin-left:.12em}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--band-line);max-width:760px}
.split i{display:block;height:100%}
.split-legend{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:10px;font-size:16px;max-width:760px}
.split-legend b{font-weight:700}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.facts{margin-top:14px;color:var(--band-muted);font-size:15px}
.facts strong{color:var(--band-ink)}

/* Dépôt des fichiers */
.drop{max-width:1180px;margin:26px auto 0;border:2px dashed var(--band-line);border-radius:18px;padding:clamp(26px,5vw,56px) 24px;text-align:center}
.drop.over{border-color:var(--gold);background:rgba(176,141,87,.08)}
.drop h2{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,38px);margin:0 0 8px;color:var(--band-ink)}
.drop p{margin:0 auto 22px;color:var(--band-muted);max-width:56ch}
.drop .acts{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.pick{display:inline-flex;align-items:center;height:52px;padding:0 22px;border-radius:12px;background:var(--gold);color:#1A1408;font-weight:700;font-size:17px;border:none;cursor:pointer}
.pick input{position:absolute;width:1px;height:1px;opacity:0}
.demo{height:52px;padding:0 20px;border-radius:12px;border:1px solid var(--band-line);background:transparent;color:var(--band-ink);font-weight:600;font-size:16px}

/* Filtres */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.filters .in{max-width:1180px;margin:0 auto;padding:10px clamp(16px,4vw,48px);display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fgroup>span{font-size:14px;color:var(--muted);margin-right:2px}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600}
.chip.on{background:var(--green);border-color:var(--green);color:var(--surface)}
.filters .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--green)}
label.btn{cursor:pointer;position:relative}
label.btn input{position:absolute;width:1px;height:1px;opacity:0}

/* Contenu */
main{max-width:calc(1180px + 2 * clamp(16px,4vw,48px));margin:0 auto;padding:22px clamp(16px,4vw,48px) 60px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px}
section{grid-column:span 12;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
section.half{grid-column:span 6}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;margin-top:6px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.kpi span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi small{font-size:13px;color:var(--muted)}
.kpi.warn b{color:var(--red,#C0392B)}
section h3{font-family:var(--display);font-weight:600;font-size:22px;margin:0 0 4px}
section .lead{color:var(--muted);font-size:15px;margin:0 0 14px}
.alerts{grid-column:span 12;display:flex;flex-direction:column;gap:8px}
.alert{border-radius:12px;padding:12px 16px;font-size:15px;background:var(--gold-soft);border:1px solid var(--gold)}
.alert.err{background:var(--red-soft);border-color:var(--red)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
th.r,td.r{text-align:right;white-space:nowrap}
tr.cat td{background:var(--soft);font-weight:700}
tr.tot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none}
.bname strong{display:block}.bname .sub{display:block;font-size:13px;color:var(--muted)}
.share{display:block;height:6px;border-radius:3px;background:var(--gold);margin-top:6px;max-width:140px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--gold-soft);color:var(--ink);margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{border:none;background:none;height:36px;padding:0 14px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--soft);color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--text);font-size:12px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted);margin-top:6px}
.reconcile{font-size:14px;color:var(--muted);margin-top:12px}
.cancel td:first-child,.cancel td:nth-child(2){white-space:nowrap}
.motif{color:var(--red);font-weight:600}
.empty{color:var(--muted);font-size:15px;padding:6px 0}
.files td .x{border:none;background:none;color:var(--red);font-weight:700;padding:2px 6px}
.status{font-size:13px;font-weight:700}
.status.ok{color:var(--green)}.status.rep{color:var(--gold)}.status.err{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:12px;font-weight:600;font-size:15px;z-index:20;max-width:calc(100% - 32px)}

/* ---------- Coquille Admin : bandeau + menu des modules ---------- */
.shell{background:var(--band);color:var(--band-ink);border-bottom:1px solid var(--band-line);padding:0 clamp(16px,4vw,48px)}
.shell .in{max-width:1180px;margin:0 auto;padding:14px 0 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:40px;border-radius:8px;display:block}
.brand .name{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.brand .name b{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em}
.brand .name span{font-size:13px;color:var(--band-muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;background:none;border:none;color:var(--band-muted);height:44px;padding:0 14px;font-size:15px;font-weight:600;border-bottom:3px solid transparent;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.nav button:hover{color:var(--band-ink)}
.nav button.on{color:var(--band-ink);border-bottom-color:var(--gold)}
.nav button svg{width:18px;height:18px;flex:none}
.nav .soon{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--band-muted);border:1px solid var(--band-line);border-radius:6px;padding:0 5px;line-height:17px}
.band{padding-top:6px}
.band-top h1{font-size:26px}
/* Accueil */
.home-hero{max-width:1180px;margin:18px auto 4px}
.home-hero h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,4vw,40px);margin:0 0 6px;color:var(--band-ink);text-wrap:balance}
.home-hero p{margin:0;color:var(--band-muted);max-width:62ch}
.mods{max-width:calc(1180px + 2 * clamp(16px,4vw,48px));margin:0 auto;padding:24px clamp(16px,4vw,48px) 60px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:1000px){.mods{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.mods{grid-template-columns:minmax(0,1fr)}}
.mod{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.mod:hover{border-color:var(--green)}
.mod.off{background:transparent;border-style:dashed}
.mod.off:hover{border-color:var(--gold)}
.mod .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--green)}
.mod.off .ic{color:var(--faint)}
.apps{max-width:calc(1180px + 2 * clamp(16px,4vw,48px));margin:-36px auto 0;padding:0 clamp(16px,4vw,48px) 60px}
.apps h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 12px}
.apps-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.app-link{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;min-width:0}
.app-link:hover{border-color:var(--green)}
.app-link .ic{width:38px;height:38px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--green)}
.app-link .ic svg{width:20px;height:20px}
.app-link .t{display:flex;flex-direction:column;min-width:0;flex:1}
.app-link .t small{color:var(--muted);font-size:13px}
.app-link .go{color:var(--muted);font-size:18px}
@media (max-width:760px){.apps-row{grid-template-columns:1fr}}
.mod .ic svg{width:24px;height:24px}
.mod h3{font-family:var(--display);font-weight:600;font-size:21px;margin:0}
.mod p{margin:0;color:var(--muted);font-size:15px;flex:1}
.mod .st{font-size:13px;font-weight:700;color:var(--green)}
.mod.off .st{color:var(--faint)}
/* Module à venir */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plan li{display:flex;gap:10px;align-items:baseline}
.plan li::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--gold);transform:translateY(-1px)}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--gold-soft);color:var(--ink);vertical-align:middle;margin-left:8px}
.band-top .pill{background:transparent;border:1px solid var(--band-line);color:var(--band-muted)}
.soon-lead{max-width:62ch;margin:8px 0 0 max(0px, calc((100% - 1180px) / 2));color:var(--band-muted)}

/* ---------- Catalogue & Paramètres ---------- */
.cat-bar{max-width:1180px;margin:14px auto 0;display:flex;flex-direction:column;gap:12px}
.rsel{display:flex;flex-wrap:wrap;gap:8px}
.rchip{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--band-line);background:transparent;color:var(--band-muted);font-size:15px;font-weight:600}
.rchip.on{background:var(--band-ink);border-color:var(--band-ink);color:var(--band)}
.cat-status{margin:0;color:var(--band-muted);font-size:15px}
.cat-status strong{color:var(--gold)}
.cat-acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ghost.lab{display:inline-flex;align-items:center;cursor:pointer;position:relative}
.ghost.lab input{position:absolute;width:1px;height:1px;opacity:0}
.ghost:disabled,.pick:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
.pick{height:46px;font-size:16px}
.alert ul{margin:6px 0 0;padding-left:20px}
.alert.ok{background:var(--soft);border-color:var(--green)}
.alert.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.cbtns{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn.danger{border-color:var(--red);color:var(--red)}
.pubpanel{border:2px solid var(--gold)}
.pubpanel .plan{margin:12px 0 16px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.faint{color:var(--faint);font-size:13px}
main input[type=text],main input[type=password],main textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:42px;width:100%;min-width:0}
main textarea{height:auto;padding:10px 12px;resize:vertical;word-break:break-all}
main input:focus,main textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);margin:0}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
.pdvs{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pdv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center}
.cathead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.cathead .cname{flex:1 1 220px;font-family:var(--display);font-size:20px;font-weight:600;height:46px}
.ctools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.ord{display:inline-flex;gap:4px;align-items:center}
.ord button{height:36px;min-width:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700;padding:0 8px}
.ord button:disabled{opacity:.3;cursor:default}
.ord .x{border-color:transparent;color:var(--red);background:none}
.ptab{min-width:460px}
.ptab td{vertical-align:middle;padding:6px 8px}
.ptab td:first-child{width:60%}
.ptab .price{text-align:right;max-width:110px}
.ptab th.c,.ptab td.c{text-align:center}
.ptab tr.off input[type=text]{color:var(--faint);text-decoration:line-through}
.catsec.off .cname{color:var(--faint)}
.catsec .btn{margin-top:12px}
.addcat{grid-column:span 12;display:flex;flex-wrap:wrap;gap:10px}
.state{display:inline-block;font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--soft);color:var(--muted)}
.state.ok{background:var(--green);color:var(--surface)}
form.unlock,form.prep{display:flex;flex-direction:column;gap:8px;max-width:520px}
.fl{font-size:14px;font-weight:700;color:var(--muted)}
.row2{display:flex;gap:10px}
.row2 .pick{flex:none}
.hint{margin:0;font-size:13px;color:var(--faint)}
.good{color:var(--green);font-weight:600}.bad{color:var(--red);font-weight:600}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary h3{display:inline}
details summary h3::after{content:" ▾";color:var(--faint);font-size:.8em}
details:not([open]) summary h3::after{content:" ▸"}
.steps{margin:0 0 16px;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:70ch}
.steps a{color:var(--green);font-weight:600}
.outbox{margin-top:16px;display:flex;flex-direction:column;gap:8px;max-width:640px}
.tests{margin-top:14px}
@media (max-width:560px){.ptab{min-width:0}.ptab thead{display:none}.ptab,.ptab tbody{display:block}.ptab tr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}.ptab td{border:none;padding:0}.ptab td:first-child{grid-column:1/-1;width:auto}.ptab .price{max-width:none;width:120px}.pdv{grid-template-columns:minmax(0,1fr) auto}.pdv .faint{display:none}.row2{flex-direction:column}}

/* ---------- Stock ---------- */
main select,main input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:42px;max-width:100%}
.dayhead input[type=date]{height:36px}
.btn.sm,.ghost.sm{height:32px;padding:0 10px;font-size:13px}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.evcard{position:relative;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:14px;min-width:0}
.evcard:hover{border-color:var(--green)}
.evtitle{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.evtitle h1{flex:0 1 auto}
.delbtn{border-color:var(--band-line);color:#F0A08E}
.delbtn:hover{border-color:#F0A08E}
.delpanel{border-color:var(--red)}
.evcard.danger{border-color:var(--red)}
.evopen{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:none;border:none;padding:16px 18px;border-radius:14px;width:100%;min-width:0}
.evx{position:absolute;right:10px;bottom:8px;background:none;border:none;color:var(--red);font-size:13px;font-weight:700;padding:6px 8px;border-radius:8px}
.evx:hover{background:var(--red-soft)}
.evdel{border-top:1px solid var(--line);padding:12px 18px 14px;display:flex;flex-direction:column;gap:10px;margin-top:-30px}
.evdel p{margin:0;font-size:14px;color:var(--ink)}
.evcard h3{margin:0;font-size:20px}
.evcard p{margin:0;color:var(--muted);font-size:14px}
.crumb{max-width:1180px;margin:0 auto 4px}
.linkish{background:none;border:none;color:var(--band-muted);padding:0;font-size:14px;font-weight:600}
.linkish:hover{color:var(--band-ink)}
.stabs{max-width:1180px;margin:18px auto -30px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.stabs button{flex:none;background:none;border:none;border-bottom:3px solid transparent;color:var(--band-muted);height:44px;padding:0 14px;font-size:15px;font-weight:600;white-space:nowrap}
.stabs button.on{color:var(--band-ink);border-bottom-color:var(--gold)}
.sv{font-weight:700}.sv.ok{color:#8FC27A}.sv.warn{color:var(--gold)}.sv.err{color:#F0A08E}.sv.sv-demo{color:var(--band-muted)}
.row-between{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.prog{font-weight:700;color:var(--green)}
.chip.add{border-style:dashed}
.stab td{vertical-align:middle}
.stab td .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.stab .qty{width:110px;text-align:right}
.stab .cnt{border-color:var(--gold)}
.stab .qty.bad{border-color:var(--red);background:var(--red-soft)}
.stab td.neg{color:var(--red);font-weight:700}
.stab.arts td input[type=text]{min-width:110px}
.stab.bil th,.stab.bil td{white-space:nowrap}
.stab.bil td:first-child{white-space:normal;min-width:160px}
.stab tr.off td{opacity:.55}
form.stkform{display:flex;flex-direction:column;gap:8px;max-width:520px}
form.stkform .cbtns{margin-top:10px}
@media (max-width:560px){.stab:not(.bil):not(.arts) thead{display:none}.stab:not(.bil):not(.arts),.stab:not(.bil):not(.arts) tbody{display:block}.stab:not(.bil):not(.arts) tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--soft)}.stab:not(.bil):not(.arts) tr.cat{display:block}.stab:not(.bil):not(.arts) td{border:none;padding:0}.stab:not(.bil):not(.arts) td:first-child{grid-column:1/-1}.stab:not(.bil):not(.arts) td[data-k=debut]::before{content:"Début ";color:var(--muted);font-size:12px}.stab:not(.bil):not(.arts) td[data-k=conso]::before{content:"Consommé ";color:var(--muted);font-size:12px}.stab:not(.bil):not(.arts) td[data-k]{text-align:left}.stab .qty{width:100%}.qwrap{display:flex;flex-wrap:wrap}.qwrap .qty{flex:1;min-width:0}.qadd{flex-wrap:nowrap}.qadd .addin{flex:1;width:auto}}

/* ---------- Bilan : dépôt des ventes ---------- */
.ghpanel{border:2px solid var(--gold)}
.ghdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.ghdate .btn{white-space:nowrap;flex:none}
.ghday{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.ghdate{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghday .tog{white-space:normal}
.tog.got{cursor:default}



/* Catalogue Caisse Soirée */
.sogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sogrid .fl{display:flex;flex-direction:column;gap:6px}
@media (max-width:700px){.sogrid{grid-template-columns:minmax(0,1fr)}}
.ptab select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;height:42px;padding:0 8px}
.ptab.so{min-width:620px}
.ptab.so td:first-child{width:40%}
.ptab.so .price{max-width:80px}
@media (max-width:560px){.ptab.so{min-width:0}.ptab.so tr{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.ptab.so td:first-child{grid-column:1/-1;width:auto}.ptab.so td{display:flex;align-items:center}.ptab.so td.r{justify-content:flex-end}.ptab.so select{width:100%}.ptab.so .price{max-width:none;width:100%}.ptab.so td:nth-child(5){justify-content:flex-start}.ptab.so td:nth-child(6){grid-column:2/-1}}
/* Stock : recherche, filtres, stock bas */
.stkfind{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:4px 0 12px}
.stkfind input[type=search]{flex:1 1 220px;max-width:360px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:42px;min-width:0}
.lowb{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--red-soft);color:var(--red);border:1px solid var(--red);white-space:normal}
.stab tr.low td:first-child strong{color:var(--red)}
.tog.lastday{display:flex;margin:2px 0 10px;white-space:normal;color:var(--ink)}
/* Stock : bouton + pour additionner un comptage */
[hidden]{display:none!important}
.qwrap{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px;max-width:100%}
.qplus{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--green);background:var(--surface);color:var(--green);font-size:20px;font-weight:700;line-height:1;padding:0}
.qplus:hover{background:var(--green);color:var(--surface)}
.qwrap .qplus[hidden]{display:block!important;visibility:hidden}
.qadd{display:inline-flex;align-items:center;gap:6px;flex-basis:100%;justify-content:flex-end}
.qadd .qsign{font-weight:800;color:var(--green);font-size:18px}
.qadd .addin{width:90px;border-color:var(--green)}
.qadd .btn.sm{height:36px}


.ghtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.ghtabs button{flex:none;background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-1px;height:42px;padding:0 16px;font-size:15px;font-weight:700;color:var(--muted)}
.ghtabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.ghtabs button:hover{color:var(--ink)}
/* Bilan : alertes fermables */
.alert.closable{display:flex;align-items:flex-start;gap:12px}
.alert.closable .atext{flex:1;min-width:0}
.aclose{flex:none;width:32px;height:32px;margin:-6px -8px -6px 0;border:none;background:transparent;border-radius:8px;font-size:15px;font-weight:700;color:var(--muted);line-height:1}
.aclose:hover{background:rgba(0,0,0,.07);color:var(--ink)}
.alerts-head{display:flex;justify-content:flex-end}
@media (max-width:860px){section.half{grid-column:span 12}.filters .right{margin-left:0}}
@media (max-width:560px){.brand .lbl{display:none}.brand img{height:34px}.brand .name b{font-size:18px}.filters{position:static}.band-top img{height:38px}.band-top h1{font-size:18px}section{padding:16px 14px}td,th{padding:8px 6px}.band-top .tools .lbl{display:none}}
@media print{
  .shell{display:none!important}
  .filters,.drop,.band-top .tools,.files,.noprint,.toast{display:none!important}
  body{background:#fff;color:#000}.band{background:#fff;color:#000;padding:0 0 10px}
  .big,.drop h2,.hero h2,.facts strong{color:#000}.facts{color:#333}
  section{break-inside:avoid;border-color:#ccc}main{display:block}section{margin-bottom:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  else if (a === 'dismissAll') { shownWarnings().forEach(function (x) { DISMISSED[x.t] = 1; }); }
  else if (a === 'print') { window.print(); return; }
  else if (a === 'csv') { exportCsv(); return; }
  else if (a === 'theme') { var t = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem(THEME_KEY, t); } catch (er) {} }
  render();
});
document.addEventListener('change', function (e) { if (e.target.hasAttribute('data-files')) { addFiles(e.target.files); e.target.value = ''; } });
function bindDrop() {
  var z = document.getElementById('drop'); if (!z) return;
  ['dragenter', 'dragover'].forEach(function (t) { z.addEventListener(t, function (e) { e.preventDefault(); z.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (t) { z.addEventListener(t, function (e) { e.preventDefault(); z.classList.remove('over'); }); });
  z.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
}
/* Glisser des fichiers n'importe où sur la page */
window.addEventListener('dragover', function (e) { e.preventDefault(); });
window.addEventListener('drop', function (e) { e.preventDefault(); if (MOD === 'bilan' && !e.target.closest('#drop') && e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
